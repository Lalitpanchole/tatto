<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <rect width="400" height="450" fill="#18181b"/>
  <!-- Decorative grid lines in background -->
  <line x1="0" y1="90" x2="400" y2="90" stroke="#27272a" stroke-width="1"/>
  <line x1="0" y1="180" x2="400" y2="180" stroke="#27272a" stroke-width="1"/>
  <line x1="0" y1="270" x2="400" y2="270" stroke="#27272a" stroke-width="1"/>
  <line x1="0" y1="360" x2="400" y2="360" stroke="#27272a" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="450" stroke="#27272a" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="450" stroke="#27272a" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="450" stroke="#27272a" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="450" stroke="#27272a" stroke-width="1"/>
  
  <!-- Sleek neon-pink circle border -->
  <circle cx="200" cy="200" r="100" fill="none" stroke="#FF66C4" stroke-width="3" opacity="0.8"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#FF66C4" stroke-width="1" stroke-dasharray="8 4" opacity="0.5"/>
  
  <!-- Stylish letter D -->
  <text x="50%" y="210" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="110" font-weight="900" fill="#FF66C4">D</text>
  
  <!-- Subtitle -->
  <text x="50%" y="360" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="6">DANI</text>
  <text x="50%" y="390" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#FF66C4" letter-spacing="2">PARTNER</text>
</svg>
